name: Agent
on:
  push:
    branches-ignore: [main, develop]
  pull_request:
  workflow_call:
    inputs:
      candidate_version:
        type: string
        default: ''
    secrets:
      FOUNDATION_PACKAGES_TOKEN:
        required: false
concurrency:
  group: agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read # Resolve foundation Maven dependencies.
jobs:
  application:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Application verification
    environment: foundation-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify release policy and evidence validators
        run: python3 -m unittest discover -s scripts/tests -p 'test_release.py'
      - name: Verify public household fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_public_household.py'
      - name: Prepare exact candidate version
        if: inputs.candidate_version != ''
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: python3 scripts/release-policy.py --prepare "$CANDIDATE_VERSION"
      - name: Scan source for secrets
        run: |
          mkdir -p target/security
          docker run --rm -v "$PWD:/src" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /src --redact --report-format json --report-path /src/target/security/gitleaks.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify actual application
        env:
          GITHUB_TOKEN: ${{ secrets.FOUNDATION_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo '::error::BLOCKED: FOUNDATION_PACKAGES_TOKEN with read:packages and access to the private foundation repository is required; Carl GITHUB_TOKEN is not equivalent.'
            exit 1
          fi
          mvn -B -ntp --settings config/maven/settings.xml.example verify
      - name: Verify actual public household reconciliation
        env:
          GITHUB_TOKEN: ${{ secrets.FOUNDATION_PACKAGES_TOKEN }}
          MAVEN_SETTINGS: config/maven/settings.xml.example
        run: bash scripts/verify-public-household.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/e2e/package-lock.json
      - name: Verify deterministic model-evaluation assertions
        run: node --test scripts/tests/test_live_evaluation.cjs
      - run: npm ci --prefix scripts/e2e
      - run: npm exec --prefix scripts/e2e -- playwright install --with-deps chromium
      - name: Verify packaged native browser workflows
        env:
          GITHUB_TOKEN: ${{ secrets.FOUNDATION_PACKAGES_TOKEN }}
          MAVEN_SETTINGS: config/maven/settings.xml.example
        run: bash scripts/verify-browser.sh
      - name: Verify packaged financial dashboards
        env:
          GITHUB_TOKEN: ${{ secrets.FOUNDATION_PACKAGES_TOKEN }}
          MAVEN_SETTINGS: config/maven/settings.xml.example
          CARL_QUALIFIED_DISTRIBUTION: ${{ github.workspace }}/target/agent
        run: bash scripts/verify-dashboard-browser.sh
      - name: Verify packaged Carl conversations
        env:
          GITHUB_TOKEN: ${{ secrets.FOUNDATION_PACKAGES_TOKEN }}
          MAVEN_SETTINGS: config/maven/settings.xml.example
          CARL_QUALIFIED_DISTRIBUTION: ${{ github.workspace }}/target/agent
        run: bash scripts/verify-talk-browser.sh
      - name: Verify packaged docked chat and System navigation
        env:
          GITHUB_TOKEN: ${{ secrets.FOUNDATION_PACKAGES_TOKEN }}
          MAVEN_SETTINGS: config/maven/settings.xml.example
          CARL_QUALIFIED_DISTRIBUTION: ${{ github.workspace }}/target/agent
          CARL_DOCKED_QBITS: 'false'
          CARL_DOCKED_REQUIRE_ESB: 'false'
        run: bash scripts/verify-docked-chat-browser.sh
      - name: Verify packaged Quick Search and ESB
        env:
          GITHUB_TOKEN: ${{ secrets.FOUNDATION_PACKAGES_TOKEN }}
          MAVEN_SETTINGS: config/maven/settings.xml.example
          CARL_QUALIFIED_DISTRIBUTION: ${{ github.workspace }}/target/agent
        run: bash scripts/verify-qbits-browser.sh
      - run: docker build --tag agent-candidate:ci .
      - name: Scan packaged dependencies and image
        run: |
          scanner='aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969'
          mkdir -p target/security
          docker run --rm -v "$PWD/target/agent:/scan:ro" "$scanner" rootfs /scan --scanners vuln --severity HIGH,CRITICAL --no-progress --exit-code 1 --list-all-pkgs --format json > target/security/dependencies.json
          docker image save --output target/candidate-image.tar agent-candidate:ci
          docker run --rm -v "$PWD/target:/scan:ro" "$scanner" image --input /scan/candidate-image.tar --scanners vuln --severity HIGH,CRITICAL --no-progress --exit-code 1 --list-all-pkgs --format json > target/security/image.json
          python3 scripts/verify-security.py --trivy target/security/dependencies.json --trivy target/security/image.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: application-tests
          path: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
            target/security/*.json
            target/site/jacoco/**
            target/browser-evidence/*.json
            target/browser-evidence/*.png
            target/browser-evidence/*.pdf
            target/dashboard-browser-evidence/*.json
            target/dashboard-browser-evidence/*.png
            target/talk-browser-evidence/*.json
            target/talk-browser-evidence/*.png
            target/docked-chat-browser-evidence/*.json
            target/docked-chat-browser-evidence/*.png
            target/qbits-browser-evidence/*.json
            target/qbits-browser-evidence/*.png
      - name: Seal exact verified candidate
        if: inputs.candidate_version != ''
        run: python3 scripts/release-evidence.py seal target/delivery
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.candidate_version != ''
        with:
          name: verified-carl-candidate
          if-no-files-found: error
          retention-days: 30
          path: target/delivery/*
  required-verification:
    name: Required application verification
    needs: application
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require completed application verification
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
        run: test "$APPLICATION_RESULT" = success
