apiVersion: batch/v1
kind: Job
metadata:
  name: carl-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-20"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carl-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: carl-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/koftwentytwo/carl-migrator:UNQUALIFIED
          args: [migrate, /run/secrets/migration/migration.properties]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: migration
              mountPath: /run/secrets/migration
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: migration
          secret:
            secretName: carl-migration
            defaultMode: 0440
            optional: false
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
